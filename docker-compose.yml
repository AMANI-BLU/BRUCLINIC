version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bruclinic-local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bruclinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - bruclinic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bruclinic"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bruclinic_pgdata:

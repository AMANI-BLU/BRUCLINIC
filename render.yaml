# ─────────────────────────────────────────────────────────────────
# BruClinic — Render Blueprint
#
# In the Render Dashboard: New → Blueprint → select this repository.
# Render creates the PostgreSQL database and the API service together.
#
# The frontend is deployed separately on Vercel (see DEPLOYMENT.md).
# ─────────────────────────────────────────────────────────────────

databases:
  - name: bruclinic-db
    databaseName: bruclinic
    user: bruclinic
    plan: free
    region: frankfurt

services:
  - type: web
    name: bruclinic-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci

    # Free Render services do not support pre-deploy commands. Migrations are
    # tracked in schema_migrations, so running them on every boot is safe and
    # also initializes a brand-new database automatically.
    startCommand: npm run db:migrate && npm start

    healthCheckPath: /api/health

    # Runs once after the first successful deploy. It only creates the admin
    # when SEED_ADMIN_* is configured; otherwise it exits without changing data.
    initialDeployHook: npm run db:seed

    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # ⚠️  Do NOT add PORT here — Render injects it automatically.
      # Manually setting PORT causes ERR_SOCKET_BAD_PORT on deploy.
      - key: LOG_LEVEL
        value: info

      # Private-network connection string for the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: bruclinic-db
          property: connectionString

      # Generated once by Render. Rotating it invalidates all active sessions.
      - key: JWT_SECRET
        generateValue: true

      # Set this to the Vercel production URL after the frontend is deployed,
      # e.g. https://bruclinic.vercel.app (no trailing slash).
      - key: CORS_ORIGIN
        sync: false

      # Used only by the one-time initialDeployHook. Clear the password after
      # the first deploy if you do not plan to run db:seed again.
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_NAME
        value: Clinic Administrator

      - key: SESSION_TIMEOUT_HOURS
        value: "8"
      - key: BACKUP_MAX_BYTES
        value: "52428800"

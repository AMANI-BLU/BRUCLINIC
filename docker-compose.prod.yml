version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bruclinic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bruclinic}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bruclinic_secure_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bruclinic}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bruclinic-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      TRUST_PROXY: "1"
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-bruclinic_secure_pass_2026}@db:5432/${DB_NAME:-bruclinic}
      JWT_SECRET: ${JWT_SECRET:-bruclinic_university_production_jwt_secret_random_64_characters_min}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: bruclinic-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
